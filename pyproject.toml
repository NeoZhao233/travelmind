[project]
name = "travelmind"
version = "0.1.0"
description = "An evaluation-first, constraint-aware travel planning agent built with LangGraph and hybrid RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "qdrant-client>=1.13",
  "typer>=0.15",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
openai = ["langchain-openai>=1.0", "openai>=2.0"]
dense = ["fastembed==0.8.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]
checkpoint = [
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.scripts]
travelmind = "travelmind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travelmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
